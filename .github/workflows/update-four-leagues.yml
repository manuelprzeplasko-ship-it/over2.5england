name: Aktualizacja 4 lig
on:
  workflow_dispatch:
  schedule:
    - cron: '25 7 * * *'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Pobierz wyniki E0-E3
        run: python scripts/update_four_leagues.py
      - name: Zapisz dane
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/all_matches.json
          if ! git diff --cached --quiet; then
            git commit -m 'Update E0-E3 results'
            git push
          fi
